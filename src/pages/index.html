<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyncForge | Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/index.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Main App Layout -->
      <div class="app-layout">
        <!--Sidebar -->
        <div class="sidebar">
          <div class="logo-container">
            <div class="logo">SyncForge</div>
            <div class="logo-icon"><i class="fas fa-tasks"></i></div>
          </div>

          <nav class="nav-menu">
            <a href="index.html" class="nav-item active" data-page="index.html">
              <div class="nav-icon"><i class="fas fa-tachometer-alt"></i></div>
              <span>Dashboard</span>
              <div class="active-indicator"></div>
            </a>
            <a href="history.html" class="nav-item" data-page="history.html">
              <div class="nav-icon"><i class="fas fa-history"></i></div>
              <span>History</span>
            </a>
            <a href="report.html" class="nav-item" data-page="report.html">
              <div class="nav-icon"><i class="fas fa-chart-bar"></i></div>
              <span>Report</span>
            </a>
            <a href="setting.html" class="nav-item" data-page="setting.html">
              <div class="nav-icon"><i class="fas fa-cog"></i></div>
              <span>Setting</span>
            </a>
          </nav>

          <div class="user-profile">
            <div class="user-avatar" id="userAvatar">
              <i class="fas fa-user"></i>
            </div>
            <div class="user-info">
              <p class="greeting">Hi there,</p>
              <p class="username" id="usernameDisplay"></p>
            </div>
          </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
          <!-- Header -->
          <header class="content-header">
            <h1 class="page-title" id="pageTitle"></h1>
            <div class="header-actions">
              <button class="action-btn notification">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" id="notifybell"></span>
              </button>
              <div
                class="notification-dropdown"
                id="notificationDropdown"
                style="display: none"
              >
                <div class="dropdown-header">Today's Tasks</div>
                <div class="dropdown-list" id="notificationTaskList"></div>
              </div>
              <!--button class="action-btn quick-add">
                <i class="fas fa-plus"></i> Quick Task
              </button-->
            </div>
          </header>

          <!-- Stats Cards -->
          <div class="stats-grid">
            <div class="stat-card total-tasks">
              <div class="card-icon">
                <i class="fas fa-tasks"></i>
              </div>
              <div class="card-content">
                <h3>Total Tasks</h3>
                <p class="card-value" id="totalTasksVal"></p>
                <p class="card-change" id="totalTasksChange"></p>
              </div>
            </div>

            <div class="stat-card completed">
              <div class="card-icon">
                <i class="fas fa-check-circle"></i>
              </div>
              <div class="card-content">
                <h3>Completed</h3>
                <p class="card-value" id="completedTasksVal"></p>
                <p class="card-change" id="completedTasksChange"></p>
              </div>
            </div>

            <div class="stat-card in-progress">
              <div class="card-icon">
                <i class="fas fa-spinner"></i>
              </div>
              <div class="card-content">
                <h3>In Progress</h3>
                <p class="card-value" id="inProgressTasksVal"></p>
                <p class="card-change" id="inProgressTasksChange"></p>
              </div>
            </div>

            <div class="stat-card overdue">
              <div class="card-icon">
                <i class="fas fa-exclamation-triangle"></i>
              </div>
              <div class="card-content">
                <h3>Overdue</h3>
                <p class="card-value" id="overdueTasksVal"></p>
                <p class="card-change" id="overdueTasksChange"></p>
              </div>
            </div>
            <!-- Dash Content Area -->
          </div>

          <!-- Task Sections -->
          <div class="task-sections">
            <!-- Active Tasks -->
            <div class="task-list active-tasks">
              <div class="task-list-header">
                <h2><i class="fas fa-tasks"></i> My Tasks</h2>
                <button class="add-task-btn" id="addTaskBtn">
                  <i class="fas fa-plus"></i> Add Task
                </button>
              </div>
              <div class="task-items" id="myTasksList"></div>
            </div>

            <!-- Completed Tasks -->
            <div class="task-list completed-tasks">
              <div class="task-list-header">
                <h2><i class="fas fa-check-circle"></i> Completed</h2>
                <button class="action-btn" id="assignTaskBtn">
                  <i class="fas fa-ellipsis-v"></i>
                </button>
              </div>
              <div class="task-items" id="teamTasksList"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Task Modal -->
      <div class="modal-overlay" id="taskModal">
        <div class="modal-container">
          <div class="modal-header">
            <h3 id="modalTitle">Create New Task</h3>
            <button class="modal-close" id="closeModal">
              <i class="fas fa-times"></i>
            </button>
          </div>

          <form id="taskForm" class="modal-form">
            <div class="form-row">
              <div class="form-group">
                <label>Task Title</label>
                <input
                  type="text"
                  id="taskName"
                  name="taskName"
                  placeholder="Enter task title"
                  class="form-input"
                />
              </div>

              <div class="form-group">
                <label>Priority</label>
                <div class="priority-selector">
                  <button type="button" class="priority-option low">Low</button>
                  <button type="button" class="priority-option medium">
                    Medium
                  </button>
                  <button type="button" class="priority-option high">
                    High
                  </button>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label>Description</label>
              <textarea
                id="description"
                name="description"
                rows="3"
                placeholder="Enter task description"
                class="form-textarea"
              ></textarea>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Start Time</label>
                <input
                  type="time"
                  id="startTime"
                  name="taskTime"
                  class="form-input"
                />
              </div>

              <div class="form-group">
                <label>End Time</label>
                <input
                  type="time"
                  id="endTime"
                  name="endTime"
                  class="form-input"
                />
              </div>

              <div class="form-group">
                <label>Due Date</label>
                <input
                  type="date"
                  id="dueDate"
                  name="dueDate"
                  class="form-input"
                />
              </div>
            </div>

            <button type="submit" class="submit-btn">
              <i class="fas fa-plus"></i> Create Task
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="../js/index.js"></script>
  </body>
</html>
