<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      connect-src 'self';
      img-src 'self' data:;"
    />
    <title>User Information</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="container">
      <div
        id="welcomeScreen"
        style="display: none; text-align: center; margin-top: 20px"
      >
        <h2>Welcome to SyncForge!</h2>
        <div
          id="loadingBarContainer"
          style="
            width: 80%;
            margin: 20px auto;
            background-color: #e0e0e0;
            border-radius: 5px;
          "
        >
          <div
            id="loadingBar"
            style="
              width: 0%;
              height: 20px;
              background-color: #4caf50;
              border-radius: 5px;
              text-align: center;
              line-height: 20px;
              color: white;
            "
          >
            0%
          </div>
        </div>
      </div>
      <h1>User Information</h1>
      <form id="userInfoForm">
        <div class="form-group">
          <label for="name" class="form-label">Full Name:</label>
          <input type="text" id="name" class="form-control" required />
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email:</label>
          <input type="email" id="email" class="form-control" required />
        </div>

        <div class="form-group">
          <label for="sleepTime" class="form-label">Sleep Time:</label>
          <input type="time" id="sleepTime" class="form-control" required />
        </div>
        <div class="form-group">
          <label for="wakeUpTime" class="form-label">Wake Up Time:</label>
          <input type="time" id="wakeUpTime" class="form-control" required />
        </div>

        <button type="submit" class="btn">
          <i class="fas fa-save"></i> Save Information
        </button>
      </form>
    </div>
    <script src="../js/login.js"></script>
    <div id="loader" class="loader"></div>
  </body>
</html>
