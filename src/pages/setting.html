<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyncForge | Setting</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/setting.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Main App Layout -->
      <div class="app-layout">
        <!--Sidebar -->
        <div class="sidebar">
          <div class="logo-container">
            <div class="logo">SyncForge</div>
            <div class="logo-icon"><i class="fas fa-tasks"></i></div>
          </div>

          <nav class="nav-menu">
            <a href="index.html" class="nav-item" data-page="index.html">
              <div class="nav-icon"><i class="fas fa-tachometer-alt"></i></div>
              <span>Dashboard</span>
            </a>
            <a href="history.html" class="nav-item" data-page="history.html">
              <div class="nav-icon"><i class="fas fa-history"></i></div>
              <span>History</span>
            </a>
            <a href="report.html" class="nav-item" data-page="report.html">
              <div class="nav-icon"><i class="fas fa-chart-bar"></i></div>
              <span>Report</span>
            </a>
            <a
              href="setting.html"
              class="nav-item active"
              data-page="setting.html"
            >
              <div class="nav-icon"><i class="fas fa-cog"></i></div>
              <span>Setting</span>
              <div class="active-indicator"></div>
            </a>
          </nav>

          <div class="user-profile">
            <div class="user-avatar" id="userAvatar">
              <i class="fas fa-user"></i>
            </div>
            <div class="user-info">
              <p class="greeting">Hi there,</p>
              <p class="username" id="usernameDisplay"></p>
            </div>
          </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
          <!-- Header -->
          <header class="content-header">
            <h1 class="page-title" id="pageTitle"></h1>
            <div class="header-actions">
              <button class="action-btn notification">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" id="notifybell"></span>
              </button>
              <button class="action-btn quick-add">
                <i class="fas fa-plus"></i> Quick Task
              </button>
            </div>
          </header>

          <!-- Setting Content Area -->
          <h4>User Information</h4>
          <form id="userInfoForm">
            <div class="form-group">
              <label for="name" class="form-label">Full Name:</label>
              <input type="text" id="name" class="form-control" required />
            </div>

            <div class="form-group">
              <label for="email" class="form-label">Email:</label>
              <input type="email" id="email" class="form-control" required />
            </div>

            <div class="form-group">
              <label for="sleepTime" class="form-label">Sleep Time:</label>
              <input type="time" id="sleepTime" class="form-control" required />
            </div>
            <div class="form-group">
              <label for="wakeUpTime" class="form-label">Wake Up Time:</label>
              <input
                type="time"
                id="wakeUpTime"
                class="form-control"
                required
              />
            </div>

            <button type="submit" class="btn">
              <i class="fas fa-save"></i> Save Information
            </button>
          </form>
        </div>

        <!--  -->
      </div>
    </div>
    <script src="../js/setting.js"></script>
  </body>
</html>
